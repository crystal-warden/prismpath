# The product manifest: what may be in this repository. tools/product_manifest.py explains the
# semantics; tools/manifest.lock enumerates every classified path. Exact paths win over prefixes and
# longer prefixes win over shorter ones. A hold rule names a research area that must never enter.

[meta]
research_repository = "https://github.com/crystal-warden/prism-path"
adopted_revision = "40a9b05b3523cb4943b583b77c6fb86f93d795ee"
product_baseline = "9129c271ff02e423706e20af266b54c2aa91b447"

# ------------------------------------------------------------------ ship: the Python engine
[[rule]]
id = "python-engine"
kind = "ship"
purpose = "engine"
owner = "research"
prefix = "prismpath/"
source_prefix = "prismpath/"
reason = "the Python engine, the CLI and their runtime data; narrower rules below carve out what is not carried"

[[rule]]
id = "compiler"
kind = "ship"
purpose = "engine"
owner = "research"
path = "prismpath/kernel/ppt_compile.py"
source_prefix = "prismpath-hw/ppt_compile.py"
reason = "the table compiler, relocated from the hardware tree; flags and output bytes unchanged"

[[rule]]
id = "canary-verifier"
kind = "ship"
purpose = "facet"
owner = "research"
path = "prismpath/telemetry/canary_verify.py"
source_prefix = "integrations/vector/canary_verify.py"
reason = "the Facet cutover verifier, relocated from the Vector integration; no Vector dependency"

[[rule]]
id = "flow-fixtures"
kind = "ship"
purpose = "fixtures"
owner = "research"
path = "prismpath/portable/flow_fixtures.py"
source_prefix = "prismpath/tests/test_portable_conformance.py"
reason = "the engine level conformance fixtures, extracted from the JavaScript port's test"

[[rule]]
id = "compiler-references"
kind = "ship"
purpose = "fixtures"
owner = "product"
prefix = "prismpath/tests/fixtures/compiler/"
reason = "thirteen frozen regression pairs generated from the adopted research compiler and one historical image"

[[rule]]
id = "authored-fixtures"
kind = "ship"
purpose = "fixtures"
owner = "product"
prefix = "prismpath/tests/fixtures/"
reason = "fixtures the carried tests read; the broken flow corpus and the copies from research keep their source in the lock"

[[rule]]
id = "product-tests"
kind = "ship"
purpose = "tests"
owner = "product"
prefix = "prismpath/tests/test_"
reason = "the product runtime suite; research tests are adopted copies (source in the lock), product tests have none"

