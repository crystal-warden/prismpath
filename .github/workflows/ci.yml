name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The product CI. Every job runs from this repository alone: no research checkout, no network beyond
# package registries. tools/README.md names the suites.

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install the wheel with the extras the shipped tests exercise
        run: |
          pip install build
          python -m build --outdir dist .
          pip install "$(ls dist/*.whl)[signing,control-plane,test]" httpx
      - name: Product runtime suite against the installed package
        run: cd /tmp && PRISMPATH_ACCEPTANCE_INSTALLED=1 python -m pytest --pyargs prismpath.tests prismpath.telemetry.tests -q -m "not cross_language" -rs
      - name: Fuzz the predicate sandbox
        run: cd /tmp && python -m prismpath.safety.fuzz_predicates -n 20000

  compatibility_and_boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install numpy pytest build
      - name: Manifest, lock and boundary
        run: |
          python -m tools.product_manifest check
          python -m tools.check_boundary
      - name: Compatibility with the adopted research revision
        run: python -m tools.check_compatibility
      - name: Crate fixtures byte identical to the product corpora
        run: python -m tools.fixture_sync
      - name: Provenance matches the tree
        run: python -m tools.provenance check
      - name: Repository maintenance suite
        run: python -m pytest tools/tests -q
      - name: Package boundary
        run: |
          python -m build --outdir dist .
          python -m tools.check_boundary --wheel dist/*.whl --sdist dist/*.tar.gz

  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Workspace tests
        run: cargo test --workspace -q
      - name: Clippy, warnings denied (baseline clean at the seed)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Each crate packages with its fixtures
        run: |
          for crate in prismpath-rs prismpath-telemetry-rs prismpath-hotswap-rs prismpath-preflight; do
            (cd "$crate" && cargo package --allow-dirty --no-verify --list | grep -E 'tests/' )
          done

  cross_language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[test]"
      - name: Tests that drive the Rust toolchain
        run: python -m pytest prismpath/tests -q -m cross_language -rs
